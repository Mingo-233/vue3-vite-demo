<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        /* margin: 0; */
        border: 1px solid black;
      }
      #preview {
        /* position: absolute;
        top: 100px;
        right: 100px; */
        margin: 30px 100px;
        border: 1px solid red;
      }
    </style>
  </head>

  <body>
    <!-- <script src="https://opentype.js.org/dist/opentype.js"></script> -->
    <script src="./opentype.js"></script>
    <script src="https://unpkg.com/wawoff2@2.0.1/build/decompress_binding.js"></script>

    <script src="./fontPaint/parse.js"></script>
    <script src="./fontPaint/generate.js"></script>

    <script>
      function load() {
        // const buffer = document.getElementById('myfile').files[0].arrayBuffer();

        // const buffer = fetch("/Gilroy-Medium.otf").then((res) =>
        //   res.arrayBuffer()
        // );
        // const buffer = fetch('/abab.woff2').then(res => res.arrayBuffer());
        const buffer = fetch("/HarmonyOS.woff2").then((res) =>
          res.arrayBuffer()
        );
        buffer.then((data) => {
          const decompressed = Module.decompress(data);
          const font = opentype.parse(decompressed);
          //   const font = opentype.parse(data);
          console.log(font);
          const {
            pathParts: paths,
            pathPartsTransform,
            pathPartsAlignTransform,
            position,
            svgSize,
            lineHeight,
            isVertical,
            domBoxSize,
          } = getCnTextPaths(font, {
            // getCnTextPaths
            text: "中文ABCDEFGH",
            // text: "水何澹澹山岛竦峙",
            // text: "hello world! 123",
            fontSize: 30,
            textAlign: "center",
            // vertical: 0,
            // MaxWidth: 200,
            // MaxHeight: 80,

            vertical: 1,
            MaxWidth: 80,
            MaxHeight: 200,
          });

          console.log(paths);

          const svgDom = genSvgCode(paths, {
            position,
            svgSize,
            lineHeight,
            isVertical,
            pathPartsTransform,
            pathPartsAlignTransform,
            domBoxSize,
          });
          document.body.appendChild(svgDom);
        });
      }
      window.load = load;

      setTimeout(() => {
        load();
      }, 1000);
    </script>
  </body>
</html>
