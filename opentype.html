    <script>
      function load() {
        // const buffer = document.getElementById('myfile').files[0].arrayBuffer();

        const buffer = fetch("/Gilroy-Medium.otf").then((res) =>
          //   res.arrayBuffer()

          // const buffer = fetch(

          // ).then((res) =>
          // const buffer = fetch("/HarmonyOS.woff2").then((res) =>

          res.arrayBuffer()
        );
        buffer.then((data) => {
          //   const decompressed = Module.decompress(data);
          //   const font = opentype.parse(decompressed);
          const font = opentype.parse(data);
          const {
            pathParts: paths,
            pathPartsTransform,
            pathPartsAlignTransform,
            position,
            svgSize,
            lineHeight,
            isVertical,
            domBoxSize,
            hasCnChar,
          } = getTextPaths(font, {
            // text: "中，文ABCDEFGHJ",
            // text: "水何澹澹山岛竦峙风何萧萧草木凋零",
            text: "hello\nworld",
            fontSize: 30,
            textAlign: "left",
            // vertical: 0,
            // MaxWidth: 200,
            // MaxHeight: 80,

            vertical: 1,
            MaxWidth: 80,
            MaxHeight: 200,
          });

          const svgDom = genSvgCode(paths, {
            position,
            svgSize,
            lineHeight,
            isVertical,
            pathPartsTransform,
            pathPartsAlignTransform,
            domBoxSize,
            hasCnChar,
          });
          document.body.appendChild(svgDom);
        });
      }
      window.load = load;

      setTimeout(() => {
        load();
      }, 1000);
    </script>
